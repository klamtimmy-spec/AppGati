<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Este es el título que sale arriba en la pestaña del navegador -->
    <title>¿Podemos seguir siendo amigos?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pantalla-1" class="contenedor">
        <img id="imagen-gato" src="inicio.jpg" alt="Gato inicial">
        <!-- Esta es la pregunta que sale en la primera pantalla -->
        <h1 id="pregunta">¿Podemos seguir siendo amigos?</h1>
        
        <div class="botones">
            <button id="btn-si">Sí</button>
            <button id="btn-no">No</button>
        </div>
    </div>

    <div id="pantalla-2" class="contenedor oculto">
        <!-- Este es el mensaje final para Ana -->
        <h1 class="mensaje-exito">¡yupiiii, sabia que ibas a decir que si, como perderte de mis exitosos chistes!</h1>
        <img src="final.gif" alt="Gato bailando">
    </div>

    <audio id="musica-fondo" src="musica.mp3" autoplay loop></audio>

    <script src="script.js"></script>
</body>
</html>
